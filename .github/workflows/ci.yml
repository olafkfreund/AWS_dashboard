name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege default token for all jobs.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Start Backend and Run Integration Smoke Test
        run: |
          # Spin up server in the background
          # We provide mock env variables so it doesn't fail on missing AWS profiles
          AWS_ACCESS_KEY_ID=mock AWS_SECRET_ACCESS_KEY=mock AWS_REGION=us-east-1 PORT=8889 node server.js &
          
          # Wait up to 10 seconds for port 8889 to be ready
          for i in {1..10}; do
            if curl -s http://localhost:8889/login.html > /dev/null; then
              echo "Server successfully listening on port 8889!"
              exit 0
            fi
            echo "Waiting for server to start..."
            sleep 1
          done
          echo "Error: Server failed to start on port 8889 in time"
          exit 1

      # Real unit suite (node:test) — a failing test fails the build.
      - name: Unit tests
        run: |
          set -o pipefail
          node --test --test-reporter=tap test/*.test.js | tee test.tap

      # Attest the unit-test result to Fides as a `test-result` attestation
      # (payload: passed/failed/skipped/total) — the same tamper-evident chain
      # the portal CR "Tests" tab + ServiceNow u_fides_test_result mirror read
      # back. Inert until aws-dashboard is onboarded to a Fides flow + secrets
      # (FIDES_SERVER_URL / FIDES_API_TOKEN); it skips cleanly when the flow or
      # creds are absent.
      - name: Attest test results to Fides
        if: ${{ always() }}
        env:
          FIDES_SERVER_URL: ${{ secrets.FIDES_SERVER_URL }}
          FIDES_API_TOKEN: ${{ secrets.FIDES_API_TOKEN }}
          FIDES_FLOW: aws-dashboard
          TRAIL_NAME: ${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${FIDES_API_TOKEN:-}" ] && [ -n "${FIDES_SERVER_URL:-}" ] || { echo "Fides not configured; skipping"; exit 0; }
          [ -f test.tap ] || { echo "no test.tap; skipping"; exit 0; }
          P=$(grep -oE '^# pass [0-9]+'    test.tap | awk '{print $3}' | tail -1); P=${P:-0}
          F=$(grep -oE '^# fail [0-9]+'    test.tap | awk '{print $3}' | tail -1); F=${F:-0}
          Sk=$(grep -oE '^# skipped [0-9]+' test.tap | awk '{print $3}' | tail -1); Sk=${Sk:-0}
          Tt=$(grep -oE '^# tests [0-9]+'  test.tap | awk '{print $3}' | tail -1); Tt=${Tt:-0}
          base="${FIDES_SERVER_URL%/}/api/v1"
          auth="Authorization: Bearer ${FIDES_API_TOKEN}"
          flow_id="$(curl -sf -H "$auth" "$base/flows" | jq -r --arg n "$FIDES_FLOW" '.[]?|select(.name==$n)|.id' | head -1 || true)"
          [ -n "${flow_id:-}" ] && [ "$flow_id" != "null" ] || { echo "flow $FIDES_FLOW not found; skipping (onboard it to enable)"; exit 0; }
          trail_id="$(curl -sf -H "$auth" "$base/flows/$flow_id/trails" | jq -r --arg n "$TRAIL_NAME" '.[]?|select(.name==$n)|.id' | head -1 || true)"
          if [ -z "${trail_id:-}" ] || [ "$trail_id" = "null" ]; then
            trail_id="$(curl -sf -H "$auth" -H 'Content-Type: application/json' -X POST "$base/trails" \
              -d "$(jq -n --arg f "$flow_id" --arg n "$TRAIL_NAME" --arg c "$COMMIT_SHA" --arg r "$REPO_URL" \
                    '{flow_id:$f,name:$n,commit:$c,repository:$r}')" | jq -r '.id')"
          fi
          if [ "$F" = "0" ]; then C=true; else C=false; fi
          payload="$(jq -nc --argjson c "$C" --argjson p "$P" --argjson f "$F" --argjson s "$Sk" --argjson t "$Tt" \
            '{compliant:$c,passed:$p,failed:$f,skipped:$s,total:$t,suite:"aws-dashboard node:test"}')"
          curl -sf -H "$auth" -H 'Content-Type: application/json' -X POST "$base/attestations" \
            -d "$(jq -n --arg tid "$trail_id" --arg pl "$payload" \
                  '{trail_id:$tid,name:"unit-tests",type_name:"test-result",payload:$pl}')" >/dev/null
          echo "attested test-result on trail $trail_id: passed=$P failed=$F skipped=$Sk total=$Tt"

  dependency-and-security:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Dependency Audit
        run: npm audit --audit-level=high || echo "High/Critical dependencies vulnerabilities found"

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # Do not block builds but report leaks

      - name: Install and Run Trivy FS Scan
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.70.0"
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz -C /tmp trivy
          /tmp/trivy fs . \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-dirs node_modules,.git \
            --exit-code 0 \
            --quiet

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t aws-status-dashboard:test .
