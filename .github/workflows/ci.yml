name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege default token for all jobs.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Start Backend and Run Integration Smoke Test
        run: |
          # Spin up server in the background
          # We provide mock env variables so it doesn't fail on missing AWS profiles
          AWS_ACCESS_KEY_ID=mock AWS_SECRET_ACCESS_KEY=mock AWS_REGION=us-east-1 PORT=8889 node server.js &
          
          # Wait up to 10 seconds for port 8889 to be ready
          for i in {1..10}; do
            if curl -s http://localhost:8889/login.html > /dev/null; then
              echo "Server successfully listening on port 8889!"
              exit 0
            fi
            echo "Waiting for server to start..."
            sleep 1
          done
          echo "Error: Server failed to start on port 8889 in time"
          exit 1

      # Real unit suite (node:test) — a failing test fails the build.
      - name: Unit tests
        run: |
          set -o pipefail
          node --test --test-reporter=tap test/*.test.js | tee test.tap

      # Attest the unit-test result to Fides as a `test-result` attestation
      # (payload: passed/failed/skipped/total) — the same tamper-evident chain
      # the portal CR "Tests" tab + ServiceNow u_fides_test_result mirror read
      # back. Inert until aws-dashboard is onboarded to a Fides flow + secrets
      # (FIDES_SERVER_URL / FIDES_API_TOKEN); it skips cleanly when the flow or
      # creds are absent.
      - name: Attest test results to Fides
        if: ${{ always() }}
        env:
          FIDES_SERVER_URL: ${{ secrets.FIDES_SERVER_URL }}
          FIDES_API_TOKEN: ${{ secrets.FIDES_API_TOKEN }}
          FIDES_FLOW: aws-dashboard
          TRAIL_NAME: ${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${FIDES_API_TOKEN:-}" ] && [ -n "${FIDES_SERVER_URL:-}" ] || { echo "Fides not configured; skipping"; exit 0; }
          [ -f test.tap ] || { echo "no test.tap; skipping"; exit 0; }
          P=$(grep -oE '^# pass [0-9]+'    test.tap | awk '{print $3}' | tail -1); P=${P:-0}
          F=$(grep -oE '^# fail [0-9]+'    test.tap | awk '{print $3}' | tail -1); F=${F:-0}
          Sk=$(grep -oE '^# skipped [0-9]+' test.tap | awk '{print $3}' | tail -1); Sk=${Sk:-0}
          Tt=$(grep -oE '^# tests [0-9]+'  test.tap | awk '{print $3}' | tail -1); Tt=${Tt:-0}
          base="${FIDES_SERVER_URL%/}/api/v1"
          auth="Authorization: Bearer ${FIDES_API_TOKEN}"
          flow_id="$(curl -sf -H "$auth" "$base/flows" | jq -r --arg n "$FIDES_FLOW" '.[]?|select(.name==$n)|.id' | head -1 || true)"
          [ -n "${flow_id:-}" ] && [ "$flow_id" != "null" ] || { echo "flow $FIDES_FLOW not found; skipping (onboard it to enable)"; exit 0; }
          trail_id="$(curl -sf -H "$auth" "$base/flows/$flow_id/trails" | jq -r --arg n "$TRAIL_NAME" '.[]?|select(.name==$n)|.id' | head -1 || true)"
          if [ -z "${trail_id:-}" ] || [ "$trail_id" = "null" ]; then
            trail_id="$(curl -sf -H "$auth" -H 'Content-Type: application/json' -X POST "$base/trails" \
              -d "$(jq -n --arg f "$flow_id" --arg n "$TRAIL_NAME" --arg c "$COMMIT_SHA" --arg r "$REPO_URL" \
                    '{flow_id:$f,name:$n,commit:$c,repository:$r}')" | jq -r '.id')"
          fi
          if [ "$F" = "0" ]; then C=true; else C=false; fi
          payload="$(jq -nc --argjson c "$C" --argjson p "$P" --argjson f "$F" --argjson s "$Sk" --argjson t "$Tt" \
            '{compliant:$c,passed:$p,failed:$f,skipped:$s,total:$t,suite:"aws-dashboard node:test"}')"
          curl -sf -H "$auth" -H 'Content-Type: application/json' -X POST "$base/attestations" \
            -d "$(jq -n --arg tid "$trail_id" --arg pl "$payload" \
                  '{trail_id:$tid,name:"unit-tests",type_name:"test-result",payload:$pl}')" >/dev/null
          echo "attested test-result on trail $trail_id: passed=$P failed=$F skipped=$Sk total=$Tt"

  dependency-and-security:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # This gates the build: a new high/critical advisory fails CI and so
      # blocks the deploy. --include=dev because dev-scope vulns count too
      # (and because npm silently omits them when NODE_ENV=production).
      - name: Run Dependency Audit
        run: npm audit --audit-level=high --include=dev

      # The gitleaks action needs a paid licence for org repos and was failing
      # with "missing gitleaks license", so no secret scanning was actually
      # happening. Run the binary directly instead, like the Trivy step below.
      - name: Run Gitleaks Secret Scan
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact --exit-code 1

      - name: Install and Run Trivy FS Scan
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.70.0"
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz -C /tmp trivy
          /tmp/trivy fs . \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-dirs node_modules,.git \
            --exit-code 0 \
            --quiet

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t aws-status-dashboard:test .

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    # Only ship from main of the canonical repo, and only once the app is
    # proven good. The public mirror runs this same workflow but must not
    # (and cannot: the IAM trust policy pins the repo) deploy.
    if: >-
      github.repository == 'synechron/AWS_dashboard'
      && github.ref == 'refs/heads/main'
      && github.event_name == 'push'
    needs: [build-and-test, dependency-and-security, docker-build]
    environment: production
    permissions:
      contents: read
      id-token: write        # required for AWS OIDC
    env:
      AWS_REGION: eu-west-2
      CLUSTER: aws-dashboard-cluster
      NAMESPACE: aws-dashboard
      DEPLOYMENT: portal-deployment
      CONTAINER: portal
      ECR_REPO: 796973489124.dkr.ecr.eu-west-2.amazonaws.com/aws-dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::796973489124:role/github-actions-aws-dashboard
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          set -euo pipefail
          docker build \
            --build-arg BUILD_COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${ECR_REPO}:${GITHUB_SHA}" \
            -t "${ECR_REPO}:latest" .
          docker push "${ECR_REPO}:${GITHUB_SHA}"
          docker push "${ECR_REPO}:latest"

      - name: Deploy to cluster
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          # Immutable tag, so every deploy is a distinct, rollback-able revision.
          kubectl -n "$NAMESPACE" set image \
            "deployment/$DEPLOYMENT" "$CONTAINER=${ECR_REPO}:${GITHUB_SHA}"
          kubectl -n "$NAMESPACE" annotate "deployment/$DEPLOYMENT" \
            kubernetes.io/change-cause="ci: ${GITHUB_SHA} via run ${GITHUB_RUN_ID}" --overwrite
          kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=5m

      - name: Verify the running build is the one we just pushed
        run: |
          set -euo pipefail
          # Cheap assertion that always works, whatever the RBAC.
          LIVE=$(kubectl -n "$NAMESPACE" get "deployment/$DEPLOYMENT" \
                   -o jsonpath="{.spec.template.spec.containers[?(@.name=='$CONTAINER')].image}")
          echo "live image: $LIVE"
          [ "$LIVE" = "${ECR_REPO}:${GITHUB_SHA}" ] \
            || { echo "::error::deployment image is $LIVE, expected ${ECR_REPO}:${GITHUB_SHA}"; exit 1; }
          # Ask the NEW ReplicaSet's pods specifically. A plain `app=portal`
          # selector also matches the previous pods while they Terminate, and
          # those still answer /healthz with the old build.
          JP="{range .items[?(@.spec.template.spec.containers[0].image=='${ECR_REPO}:${GITHUB_SHA}')]}{.metadata.labels.pod-template-hash}{'\n'}{end}"
          HASH=$(kubectl -n "$NAMESPACE" get rs -l app=portal -o jsonpath="$JP" | head -n1)
          [ -n "$HASH" ] || { echo "::error::no ReplicaSet found for ${GITHUB_SHA}"; exit 1; }
          POD=$(kubectl -n "$NAMESPACE" get pod \
                  -l "app=portal,pod-template-hash=$HASH" \
                  --field-selector=status.phase=Running \
                  -o jsonpath='{.items[0].metadata.name}')
          echo "probing pod: $POD"
          for i in 1 2 3 4 5; do
            BODY=$(kubectl -n "$NAMESPACE" exec "$POD" -- \
                     node -e "fetch('http://localhost:8889/healthz').then(r=>r.text()).then(console.log)" 2>/dev/null || true)
            echo "$BODY"
            case "$BODY" in *"$GITHUB_SHA"*) exit 0 ;; esac
            sleep 5
          done
          echo "::error::/healthz did not report ${GITHUB_SHA}"
          exit 1
